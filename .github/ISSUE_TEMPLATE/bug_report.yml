name: Error
description: Informa de un comportamiento incorrecto en ATLAS Genesis.
title: "[Error]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Describe el fallo de forma reproducible. No publiques prompts privados,
        datos personales, claves ni credenciales.
  - type: textarea
    id: problem
    attributes:
      label: Problema observado
      description: ¿Qué ocurrió y qué esperabas que ocurriera?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Configuración inicial
        2. Acción ejecutada
        3. Resultado observado
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Sistema operativo, versión de Python, modelo/gateway y dependencias relevantes.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errores o logs redactados
      description: Elimina tokens, secretos, prompts y datos personales antes de adjuntar.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación (si se conocen)
      placeholder: |
        - [ ] ...
    validations:
      required: false
